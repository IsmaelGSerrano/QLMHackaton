# Local Neo4j for exploring the AML transaction graph.
#   NEO4J_PASSWORD must be set in your shell (any value >= 8 chars; local only).
#   Load data with:  uv run python scripts/neo4j_load.py data/raw/HI-Small_Trans.csv --run
#   Browser:         http://localhost:7474   (bolt://localhost:7687)
services:
  neo4j:
    image: neo4j:5.26.16-community
    container_name: qlmaml-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/import:/import
      - ./data/neo4j/plugins:/plugins
