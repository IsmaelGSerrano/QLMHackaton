[project]
name = "qlmaml"
version = "0.0.1"
description = "Quantum ML for anti-money laundering on the IBM AML dataset (hackathon)"
requires-python = ">=3.12"
dependencies = [
    # Data
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    # Classical ML baseline
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # NOTE: IBM's snapml (GraphFeaturePreprocessor) has no wheel for Python 3.12 on
    # Windows, so motif features are implemented in src/qlmaml/features.py instead.
    "python-igraph>=0.11",
    # Quantum
    "pennylane>=0.38",
    # Tooling
    "kaggle>=1.6",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "neo4j>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
